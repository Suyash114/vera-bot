services:
  - type: web
    name: vera-bot
    runtime: docker
    plan: free            # free plan on Render
    numInstances: 1          # state is in memory — never scale out
    healthCheckPath: /v1/healthz
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: PLAYGROUND
        value: "true"
      - key: LLM_API_KEY
        sync: false          # set in the Render dashboard; never commit it
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
